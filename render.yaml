services:
  # Backend Service (OpenSign Server)
  - type: web
    name: opensign-server
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd apps/OpenSignServer && npm ci
    startCommand: cd apps/OpenSignServer && npm start
    envVars:
      # App Config
      - key: NODE_ENV
        value: production
      - key: APP_ID
        value: opensign
      - key: appName
        value: OpenSign
      - key: MASTER_KEY
        value: 9HFhqrjDtIYf1lJ4
      - key: PARSE_MOUNT
        value: /app
      - key: PORT
        value: 8080
      
      # MongoDB Atlas
      - key: MONGODB_URI
        value: mongodb+srv://opensign_user:l3UtJZj4RUx9CkJI@opensign-db.rio37ak.mongodb.net/opensign?appName=opensign-db
      
      # URLs (atualize depois com URLs reais)
      - key: SERVER_URL
        sync: false
      
      # SMTP Umbler
      - key: SMTP_ENABLE
        value: true
      - key: SMTP_HOST
        value: smtp.umbler.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER_EMAIL
        value: naoresponda@efoconecta.online
      - key: SMTP_PASS
        value: 478E-rb(iT7Lu
      
      # Cloudflare R2 Storage
      - key: USE_LOCAL
        value: false
      - key: DO_SPACE
        value: opensign-files
      - key: DO_ENDPOINT
        value: cc024698dc0189c7f1a75f15f1b5e25e.r2.cloudflarestorage.com
      - key: DO_BASEURL
        value: https://opensign-files.cc024698dc0189c7f1a75f15f1b5e25e.r2.dev
      - key: DO_ACCESS_KEY_ID
        value: ea7e421f8f2972f865ffa01b6d45fbd5
      - key: DO_SECRET_ACCESS_KEY
        value: cf0d16a9baf2566d97c559e2f5e14a8262780d9617f1c34a795dfa91747acb2a
      - key: DO_REGION
        value: auto
    healthCheckPath: /app/health

  # Frontend Service (OpenSign React App)
  - type: web
    name: opensign-frontend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd apps/OpenSign && npm ci && npm run build
    startCommand: cd apps/OpenSign && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_APPID
        value: opensign
      - key: GENERATE_SOURCEMAP
        value: false
      - key: PORT
        value: 3000
      
      # URLs (atualize depois com URLs reais dos serviços)
      - key: PUBLIC_URL
        sync: false
      - key: REACT_APP_SERVERURL
        sync: false
